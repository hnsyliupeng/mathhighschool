}

.turn-zone.right span { transform: scaleX(-1); }

.flip-layer {
  position: absolute; inset: 0; z-index: 20; pointer-events: none;

}

.flip-page {
  position: absolute; top: 0; right: 0; width: 50%; height: 100%;

}

}
.flip-layer.next .flip-page { animation: flipNext .62s cubic-bezier(.5, .05, .3, 1) forwards; }

@keyframes flipNext { from { transform: rotateY(0deg); } to { transform: rotateY(-172deg); } }
@keyframes flipPrev { from { transform: rotateY(0deg); } to { transform: rotateY(172deg); } }

}

      const host = this.canvas.parentElement;
      const w = (host ? host.clientWidth : this.canvas.clientWidth) || 480;
      const h = (host ? host.clientHeight : this.canvas.clientHeight) || 400;
      this.w = w; this.h = h; this.dpr = dpr;
      this.canvas.width = Math.round(w * dpr);
      this.canvas.height = Math.round(h * dpr);
      this.canvas.style.width = w + 'px';
      this.canvas.style.height = h + 'px';
      this.dirty = true;
    }

    /* ---------------- 相机 ---------------- */
    _cam() {
      const cy = Math.cos(this.yaw), sy = Math.sin(this.yaw);
      const cp = Math.cos(this.pitch), sp = Math.sin(this.pitch);
      const d = this.dist;
      // 相机世界坐标（先绕 Y 后绕 X）
      const camPos = [
        d * sy * cp + this.offset[0],
        -d * sp + this.offset[1],
        d * cy * cp + this.offset[2],
      ];
      return { cy, sy, cp, sp, d, camPos };
    }

    project(p) {
      const { cy, sy, cp, sp, d } = this._c;
      const x = p[0] - this.offset[0], y = p[1] - this.offset[1], z = p[2] - this.offset[2];
      const x1 = x * cy - z * sy;
      const z1 = x * sy + z * cy;
      const y2 = y * cp - z1 * sp;
      const z2 = y * sp + z1 * cp;
      const depth = d - z2;
      if (depth < 0.2) return null;
      const k = (this._k * d) / depth;
      return {
        x: this.w / 2 + x1 * k,
        y: this.h / 2 - y2 * k,
        d: depth,
        k,
      };
    }

    /* ---------------- 主循环 ---------------- */
    _loop(ts) {
      this._raf = requestAnimationFrame(this._loop);
      if (!this.active) return;
      const dt = this._last ? Math.min((ts - this._last) / 1000, 0.05) : 0;
      this._last = ts;
      if (this.autoSpin && !this._drag) { this.yaw += this.autoSpin * dt; this.dirty = true; }
      if (this._anim) { this.time += dt; this.dirty = true; }
      if (!this.dirty) return;
      this.render();
      this.dirty = false;
    }

    render() {
      const ctx = this.ctx;
      if (!ctx) return;
      const pal = this.palette || DEFAULT_PALETTE;
      ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
      ctx.clearRect(0, 0, this.w, this.h);
      this._c = this._cam();
      this._k = (Math.min(this.w, this.h) / this.fov) * this.zoom;
      let scene;
      try { scene = this.sceneFn(this.time) || { items: [] }; }
      catch (err) { console.error('scene error', err); scene = { items: [] }; }
      const items = flatten(scene.items || []);
      this._pal = pal;
      const size = Math.min(this.w, this.h);
      this._strokeBase = clamp(size / 460, 0.72, 1.5);

      // 自动取景：根据 scene.fit 计算整体缩放
      if (scene.fit) {
        const k0 = this._k;
        this._k = k0 * scene.fit;
      }

      const normal = [], top = [], labels = [], balls = [], points = [];
      for (const it of items) {
        if (!it) continue;
        if (it.type === 'label') { labels.push(it); continue; }
        if (it.type === 'point') { points.push(it); continue; }
        if (it.type === 'ball') { balls.push(it); continue; }
        if (it.layer === 'top') { top.push(it); continue; }
        normal.push(it);
      }
      // 画家算法：远 → 近
      normal.forEach(it => { it._depth = itemDepth(this, it); });
      normal.sort((a, b) => {
        if (Math.abs(b._depth - a._depth) < 1e-6) return (a.type === 'face' ? -1 : 1);
        return b._depth - a._depth;
      });
      this._pickables = [];

      for (const it of normal) this._drawNormal(it, pal);
      // 透视模式下先铺半透明“前脸之后的体”再画顶层面
      balls.forEach(b => this._drawBall(b, pal));
      for (const it of top) this._drawTop(it, pal);
      for (const it of points) this._drawPoint(it, pal);
      if (this.showLabels) for (const it of labels) this._drawLabel(it, pal);
      if (this.hover && this.showLabels) this._drawHoverTip(pal);
    }

    /* ---------------- 绘制：基础风格 ---------------- */
    _alpha(it, base) {
      let a = base;
      if (it.alpha != null) a *= it.alpha;
      if (this.focus.size && it.key) {
        const hit = [...this.focus].some(k => it.key === k || it.key.indexOf(k + ':') === 0 || k.indexOf(it.key + ':') === 0);
        if (!hit) a *= 0.13;
      }
      return a;
    }

    _color(it, pal, kind) {
      if (it.color) return it.color;
      if (this.focus.size && it.key) {
        const hit = [...this.focus].some(k => it.key === k || it.key.indexOf(k + ':') === 0 || k.indexOf(it.key + ':') === 0);
        if (hit) return pal.accent;
      }
      if (kind === 'fill') return it.tint || pal.tint;
      return pal.ink;
    }

    _inkPath(pts, seed, amp, closed) {
      const ctx = this.ctx;
      ctx.beginPath();
      const n = pts.length;
      if (!n) return;
      const jitter = [];
      for (let i = 0; i < n; i++) {
        jitter.push([
          pts[i][0] + noise(seed, i * 2) * amp,
          pts[i][1] + noise(seed, i * 2 + 1) * amp,
        ]);
      }
      ctx.moveTo(jitter[0][0], jitter[0][1]);
      for (let i = 1; i < n; i++) {
        const p = jitter[i], q = jitter[i - 1];
        // 轻微中点偏移，模拟手绘
        const mx = (p[0] + q[0]) / 2 + noise(seed + 7, i) * amp * 0.9;
        const my = (p[1] + q[1]) / 2 + noise(seed + 11, i) * amp * 0.9;
        ctx.quadraticCurveTo(mx, my, p[0], p[1]);
      }
      if (closed) ctx.closePath();
    }

    _strokeInk(pts, seed, opt) {
      const ctx = this.ctx;
      const amp = (opt.amp != null ? opt.amp : 0.55) * this._strokeBase;
      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      if (opt.dash) ctx.setLineDash(opt.dash);
      // 主墨线
      ctx.strokeStyle = opt.color;
      ctx.globalAlpha = opt.alpha;
      ctx.lineWidth = opt.width * this._strokeBase;
      this._inkPath(pts, seed, amp, opt.closed);
      ctx.stroke();
      // 复描一笔，产生“手绘毛边”
      if (!opt.dash && opt.width > 0.9) {
        ctx.globalAlpha = opt.alpha * 0.45;
        ctx.lineWidth = opt.width * this._strokeBase * 0.6;
        this._inkPath(pts.map(p => [p[0] + 0.7, p[1] - 0.5]), seed + 97, amp * 1.5, opt.closed);
        ctx.stroke();
      }
      ctx.restore();
    }

    _projPts(pts) {
      const out = [];
      for (const p of pts) {
        const q = this.project(p);
        if (!q) return null;
        out.push(q);
      }
      return out;
    }

    _drawNormal(it, pal) {
      const ctx = this.ctx;
      if (it.type === 'face') {
        const pp = this._projPts(it.pts);
        if (!pp || pp.length < 3) return;
        const seed = hashStr(it.key || 'f' + (it.seed || 0) + pp.length);
        const alpha = this._alpha(it, this.seeThrough ? 0.16 : (it.alpha0 != null ? it.alpha0 : 0.96));
        ctx.save();
        const fill = this._color(it, pal, 'fill');
        ctx.fillStyle = rgba(fill, alpha);
        this._inkPath(pp.map(p => [p.x, p.y]), seed, 1.1, true);
        ctx.fill();
        if (it.texture !== false) {
          // 铅笔排线：极淡的斜线，制造手绘纸面质感（仅对较大的面）
          let minx = 1e9, miny = 1e9, maxx = -1e9, maxy = -1e9;
          for (const p of pp) { minx = Math.min(minx, p.x); miny = Math.min(miny, p.y); maxx = Math.max(maxx, p.x); maxy = Math.max(maxy, p.y); }
          if ((maxx - minx) * (maxy - miny) > 1300) {
            ctx.save();
            ctx.clip();
            ctx.globalAlpha = 0.07;
            ctx.strokeStyle = pal.ink;
            ctx.lineWidth = 0.7;
            const step = 11;
            const seed0 = (seed % 7) - 3;
            for (let x = minx - (maxy - miny); x < maxx + 4; x += step) {
              ctx.beginPath();
              ctx.moveTo(x + seed0, maxy + 3);
              ctx.lineTo(x + (maxy - miny) + seed0, miny - 3);
              ctx.stroke();
            }
            ctx.restore();
          }
        }
        if (it.hatch) {
          ctx.save();
          ctx.clip();
          ctx.globalAlpha = 0.35;
          ctx.strokeStyle = pal.inkLight || pal.ink;
          ctx.lineWidth = 0.7;
          const bb = pp.reduce((o, p) => [Math.min(o[0], p.x), Math.min(o[1], p.y), Math.max(o[2], p.x), Math.max(o[3], p.y)], [1e9, 1e9, -1e9, -1e9]);
          for (let x = bb[0] - 40; x < bb[2] + 40; x += 9) {
            ctx.beginPath(); ctx.moveTo(x, bb[1] - 10); ctx.lineTo(x + 30, bb[3] + 10); ctx.stroke();
          }
          ctx.restore();
        }
        ctx.restore();
        if (it.edge !== false) {
          this._strokeInk(pp.map(p => [p.x, p.y]), seed + 3, {
            color: it.edgeColor || this._color(it, pal, 'stroke'),
            width: it.sw || 1.5,
            alpha: this._alpha(it, this.seeThrough ? 0.55 : 0.95),
            closed: true,
          });
        }
        if (it.key) this._pickables.push({ key: it.key, poly: pp, depth: it._depth, tip: it.tip });
        return;
      }
      if (it.type === 'line' || it.type === 'poly') {
        const raw = it.type === 'line' ? [it.a, it.b] : it.pts;
        const pp = this._projPts(raw);
        if (!pp || pp.length < 2) return;
        const seed = hashStr(it.key || 'l' + (it.seed || 0) + raw.length);
        this._strokeInk(pp.map(p => [p.x, p.y]), seed, {
          color: this._color(it, pal, 'stroke'),
          width: it.sw || (it.key ? 2 : 1.25),
          alpha: this._alpha(it, it.alpha0 != null ? it.alpha0 : 1),
          dash: it.dash,
          closed: it.type === 'poly' && it.closed,
          amp: it.amp,
        });
        if (it.key && it.type === 'line') this._pickables.push({ key: it.key, seg: pp, depth: it._depth });
        return;
      }
    }

    _drawTop(it, pal) {
      const ctx = this.ctx;
      if (it.type === 'face') {
        const pp = this._projPts(it.pts);
        if (!pp) return;
        ctx.save();
        ctx.fillStyle = rgba(this._color(it, pal, 'fill'), this._alpha(it, it.alpha0 != null ? it.alpha0 : 0.5));
        this._inkPath(pp.map(p => [p.x, p.y]), hashStr(it.key || 'tf') + 5, 0.8, true);
        ctx.fill();
        ctx.restore();
        this._strokeInk(pp.map(p => [p.x, p.y]), hashStr(it.key || 'tf') + 9, {
          color: this._color(it, pal, 'stroke'), width: it.sw || 1.7,
          alpha: this._alpha(it, 0.95), dash: it.dash, closed: true,
        });
        if (it.key) this._pickables.push({ key: it.key, poly: pp, depth: -1, tip: it.tip });
        return;
      }
      if (it.type === 'line' || it.type === 'poly') {
        const raw = it.type === 'line' ? [it.a, it.b] : it.pts;
        const pp = this._projPts(raw);
        if (!pp) return;
        this._strokeInk(pp.map(p => [p.x, p.y]), hashStr(it.key || 'tl') + 2, {
          color: this._color(it, pal, 'stroke'),
          width: it.sw || 2,
          alpha: this._alpha(it, it.alpha0 != null ? it.alpha0 : 1),
          dash: it.dash, closed: it.closed,
        });
        if (it.arrow) this._arrow(pp[pp.length - 2], pp[pp.length - 1], this._color(it, pal, 'stroke'));
        return;
      }
      if (it.type === 'angle') {
        const a = this.project(it.a), b = this.project(it.b), c = this.project(it.c);
        if (!a || !b || !c) return;
        const r = 26 * this._strokeBase;
        const a1 = Math.atan2(a.y - b.y, a.x - b.x), a2 = Math.atan2(c.y - b.y, c.x - b.x);
        ctx.save();
        ctx.strokeStyle = this._color(it, pal, 'stroke');
        ctx.globalAlpha = this._alpha(it, 0.95);
        ctx.lineWidth = 1.6 * this._strokeBase;
        ctx.beginPath();
        let d = a2 - a1;
        while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU;
        ctx.arc(b.x, b.y, r, a1, a1 + d, d < 0);
        ctx.stroke();
        if (it.text) {
          const mid = a1 + d / 2;
          ctx.globalAlpha = this._alpha(it, 1);
          ctx.fillStyle = this._color(it, pal, 'stroke');
          ctx.font = `600 ${11.5 * this._strokeBase}px ${FONTS.kai}`;
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          this._haloText(it.text, b.x + Math.cos(mid) * (r + 13), b.y + Math.sin(mid) * (r + 13));
        }
        ctx.restore();
        return;
      }
    }

    _arrow(a, b, color) {
      const ctx = this.ctx;
      const ang = Math.atan2(b.y - a.y, b.x - a.x);
      const s = 9 * this._strokeBase;
      ctx.save();
      ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(b.x, b.y);
      ctx.lineTo(b.x - s * Math.cos(ang - 0.4), b.y - s * Math.sin(ang - 0.4));
      ctx.lineTo(b.x - s * Math.cos(ang + 0.4), b.y - s * Math.sin(ang + 0.4));
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    _drawPoint(it, pal) {
      const ctx = this.ctx;
      const q = this.project(it.p);
      if (!q) return;
      const color = this._color(it, pal, 'stroke');
      const alpha = this._alpha(it, 1);
      const r = (it.r || 3.6) * this._strokeBase;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.arc(q.x, q.y, r, 0, TAU); ctx.fill();
      if (it.ring) {
        ctx.globalAlpha = alpha * 0.35;
        ctx.beginPath(); ctx.arc(q.x, q.y, r + 4.5, 0, TAU); ctx.strokeStyle = color; ctx.lineWidth = 1.2; ctx.stroke();
      }
      ctx.restore();
      if (it.key) this._pickables.push({ key: it.key, p: q, depth: -2 });
    }

    _drawLabel(it, pal) {
      const q = this.project(it.p);
      if (!q) return;
      const color = this._color(it, pal, 'stroke');
      const alpha = this._alpha(it, 1);
      const size = (it.size || 13.5) * this._strokeBase;
      const ctx = this.ctx;
      const dx = it.dx || 0, dy = it.dy || 0;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.font = `${it.bold === false ? 500 : 700} ${size}px ${FONTS.kai}`;
      ctx.textAlign = it.align || 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = color;
      if (it.leader) {
        ctx.globalAlpha = alpha * 0.5;
        ctx.strokeStyle = color; ctx.lineWidth = 0.8;
        ctx.beginPath(); ctx.moveTo(q.x, q.y); ctx.lineTo(q.x + dx, q.y + dy); ctx.stroke();
        ctx.globalAlpha = alpha;
      }
      this._haloText(it.text, q.x + dx, q.y + dy);
      if (it.key) this._pickables.push({ key: it.key, p: { x: q.x + dx, y: q.y + dy }, depth: -3 });
      ctx.restore();
    }

    _haloText(text, x, y) {
      const ctx = this.ctx;
      ctx.save();
      ctx.lineWidth = 4.5;
      ctx.strokeStyle = (this._pal && this._pal.paper) || '#faf5e9';
      ctx.lineJoin = 'round';
      ctx.strokeText(text, x, y);
      ctx.fillText(text, x, y);
      ctx.restore();
    }

    _drawBall(it, pal) {
      const ctx = this.ctx;
      const c = this.project(it.c);
      if (!c) return;
      const R = it.r * c.k;
      if (R < 1) return;
      const alpha = this._alpha(it, 1);
      const base = it.color || pal.tint;
      const lit = mix(base, '#ffffff', 0.55);
      const deep = mix(base, pal.ink, 0.25);
      ctx.save();
      ctx.globalAlpha = alpha;
      const g = ctx.createRadialGradient(c.x - R * 0.35, c.y - R * 0.4, R * 0.1, c.x, c.y, R * 1.15);
      g.addColorStop(0, rgba(lit, this.seeThrough ? 0.34 : 0.98));
      g.addColorStop(0.65, rgba(base, this.seeThrough ? 0.26 : 0.92));
      g.addColorStop(1, rgba(deep, this.seeThrough ? 0.2 : 0.9));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(c.x, c.y, R, 0, TAU); ctx.fill();
      ctx.restore();
      // 轮廓
      const circle = [];
      for (let i = 0; i <= 40; i++) {
        const a = i / 40 * TAU;
        circle.push([c.x + Math.cos(a) * R, c.y + Math.sin(a) * R]);
      }
      this._strokeInk(circle, hashStr('ball' + (it.key || '')), {
        color: this._color(it, pal, 'stroke'), width: 1.7,
        alpha: alpha * (this.seeThrough ? 0.7 : 0.95), closed: true,
      });
      // 大圆（赤道 + 两条经线），背面用虚线
      const camPos = this._c.camPos, ctr = it.c;
      const planes = [
        { u: [1, 0, 0], v: [0, 0, 1] },
        { u: [0, 1, 0], v: [0, 0, 1] },
        { u: [1, 0, 0], v: [0, 1, 0] },
      ];
      planes.forEach((pl, idx) => {
        const front = [], back = [];
        for (let i = 0; i <= 72; i++) {
          const a = i / 72 * TAU;
          const p = V.add(ctr, V.add(V.mul(pl.u, it.r * Math.cos(a)), V.mul(pl.v, it.r * Math.sin(a))));
          const q = this.project(p);
          if (!q) continue;
          const vis = V.dot(V.sub(p, ctr), V.sub(camPos, ctr)) >= 0;
          (vis ? front : back).push([q.x, q.y]);
        }
        if (back.length > 1) this._strokeInk(back, hashStr('bb' + idx), {
          color: this._color(it, pal, 'stroke'), width: 1,
          alpha: alpha * (this.seeThrough ? 0.55 : 0.28), dash: [4, 4],
        });
        if (front.length > 1) this._strokeInk(front, hashStr('bf' + idx), {
          color: this._color(it, pal, 'stroke'), width: 1.15, alpha: alpha * 0.72,
        });
      });
      if (it.key) this._pickables.push({ key: it.key, p: c, depth: -4 });
    }

    /* ---------------- 拾取 ---------------- */
    _pick(x, y) {
      let best = null;
      const sorted = this._pickables.slice().sort((a, b) => (a.depth || 0) - (b.depth || 0));
      for (const p of sorted) {
        if (p.poly && pointInPoly(x, y, p.poly)) best = p;
        else if (p.p && Math.hypot(p.p.x - x, p.p.y - y) < 15) best = p;
        else if (p.seg && distToSeg(x, y, p.seg[0], p.seg[1]) < 6) best = p;
        if (best) break;
      }
      if (best && this.onPick) this.onPick(best.key, best.tip);
      else if (!best && this.onPick) this.onPick(null);
    }

    _hoverAt(e) {
      if (!this.showLabels) return;
      const r = this.canvas.getBoundingClientRect();
      const x = e.clientX - r.left, y = e.clientY - r.top;
      let hit = null;
      for (const p of this._pickables) {
        if (p.p && Math.hypot(p.p.x - x, p.p.y - y) < 16) hit = p;
      }
      const key = hit ? hit.key : null;
      if (key !== this.hover) { this.hover = key; this.canvas.style.cursor = key ? 'pointer' : 'grab'; }
    }

    _drawHoverTip(pal) {
      // 悬停时轻微强化：不额外绘制，保持画面干净
    }
  }

  function itemDepth(st, it) {
    let pts;
    if (it.type === 'line') pts = [it.a, it.b];
    else if (it.pts) pts = it.pts;
    else return 0;
    let sum = 0, n = 0;
    for (const p of pts) {
      const q = st.project(p);
      if (q) { sum += q.d; n++; }
    }
    return n ? sum / n : 0;
  }

  function flatten(arr) {
    const out = [];
    for (const it of arr) {
      if (!it) continue;
      if (Array.isArray(it)) out.push(...flatten(it));
      else out.push(it);
    }
    return out;
  }

  function pointInPoly(x, y, pts) {
    let inside = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const xi = pts[i].x, yi = pts[i].y, xj = pts[j].x, yj = pts[j].y;
      if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
    }
    return inside;
  }
  function distToSeg(px, py, a, b) {
    const dx = b.x - a.x, dy = b.y - a.y;
    const L = dx * dx + dy * dy || 1;
    let t = ((px - a.x) * dx + (py - a.y) * dy) / L;
    t = clamp(t, 0, 1);
    return Math.hypot(px - (a.x + t * dx), py - (a.y + t * dy));
  }

  const DEFAULT_PALETTE = {
    ink: '#2b2823', inkLight: '#6f675a', paper: '#fbf6e9',
    tint: '#f0e3c8', accent: '#e4573d', accent2: '#3a6eb5',
  };

  global.Ink3D = {
    Studio, V, TAU, clamp, mix, rgba, hashStr, noise,
    palette: DEFAULT_PALETTE,
    FONTS,
    setFonts(f) { Object.assign(FONTS, f || {}); },
    // 场景元素工厂
    face(pts, o) { return Object.assign({ type: 'face', pts }, o); },
    line(a, b, o) { return Object.assign({ type: 'line', a, b }, o); },
    poly(pts, o) { return Object.assign({ type: 'poly', pts }, o); },
    point(p, o) { return Object.assign({ type: 'point', p }, o); },
    label(p, text, o) { return Object.assign({ type: 'label', p, text }, o); },
    ball(c, r, o) { return Object.assign({ type: 'ball', c, r }, o); },
    angle(a, b, c, text, o) { return Object.assign({ type: 'angle', a, b, c, text, layer: 'top' }, o); },
  };
})(window);

/* =============================================================
   几何库 geo.js：多面体 / 旋转体 / 球 / 截面 / 平面 / 辅助标注

  function polySolid(o) {

  /* ---------- 长方体 / 正方体 ---------- */
  function box(o) {

      { pts: [t[0], t[1], t[2], t[3]], shade: 0.0 },    // 上底
      { pts: [b[0], b[1], t[1], t[0]], shade: 0.05 },   // 前 ABB1A1
      { pts: [b[1], b[2], t[2], t[1]], shade: 0.09 },   // 右
      { pts: [b[2], b[3], t[3], t[2]], shade: 0.04 },   // 后

      [t[0], t[1]], [t[1], t[2]], [t[2], t[3]], [t[3], t[0]],

  /* ---------- 旋转体：轮廓旋转 ---------- */

          <div class="q-head"><span class="qn">1</span><span>判断下列命题是否正确（点击选项查看判定）。</span></div>
          <div class="opts">
            <button class="opt" data-ok="0"><span class="mk">①</span>底面是正多边形的棱柱是正棱柱。</button>
            <button class="opt" data-ok="1"><span class="mk">②</span>正棱锥的各侧棱相等，各侧面是全等的等腰三角形。</button>
            <button class="opt" data-ok="0"><span class="mk">③</span>各侧面都是全等等腰三角形的棱锥是正棱锥。</button>
            <button class="opt" data-ok="0"><span class="mk">④</span>棱台的侧棱一定相等。</button>
          </div>
          <button class="ans-btn" data-reveal>显示答案与错因</button>
          <div class="ans">
            <div class="a-line"><b>答案</b>　① ×　② √　③ ×　④ ×</div>
            <div class="sol-step" data-n="1">① 错。还缺少“侧棱垂直于底面”。斜棱柱的底面可以是正多边形，但它不是正棱柱。</div>
            <div class="sol-step" data-n="2">② 对。由正棱锥的定义与对称性，侧棱都等于 √(h²+R²)，斜高都等于 √(h²+r²)。</div>
            <div class="sol-step" data-n="3">错。反例：把正四棱锥的顶点沿平行底面的方向平移，侧面仍可保持全等等腰三角形，但顶点射影不在底面中心。</div>
            <div class="sol-step" data-n="4">错。只有<b>正棱台</b>的侧棱才相等；一般棱台的侧棱长可以互不相等。</div>
          </div>
        </div>
        <div class="q">
          <div class="q-head"><span class="qn">2</span><span>正六棱锥的底面边长为 2，侧棱长为 √13，求它的高与斜高。</span></div>
          <button class="ans-btn" data-reveal>显示答案与步骤</button>
          <div class="ans">
            <div class="a-line"><b>答案</b>　高 h = 3，斜高 h′ = 2√3。</div>
            <div class="sol-step" data-n="1">正六边形外接圆半径 R = 边长 = 2，边心距 r = (√3/2)×2 = √3。</div>
            <div class="sol-step" data-n="2">由 h² + R² = l² 得 h² = 13 − 4 = 9，h = 3。</div>
            <div class="sol-step" data-n="3">由 h² + r² = h′² 得 h′² = 9 + 3 = 12，h′ = 2√3。</div>
          </div>
        </div>
        <div class="q">
          <div class="q-head"><span class="qn">3</span><span>（教材习题 8.1 第 3 题）棱台的两底面面积分别为 S′、S，高为 h，写出棱台体积公式并说明它与棱柱、棱锥的关系。</span></div>
          <button class="ans-btn" data-reveal>显示答案</button>
          <div class="ans">
            <div class="a-line"><b>答案</b>　<span class="f">V = <span class="frac"><span class="num">1</span><span class="den">3</span></span>h(S′ + √(S′S) + S)</span></div>
            <div class="sol-step" data-n="1">当 S′ = S 时，V = Sh，退化为棱柱的体积公式。</div>
            <div class="sol-step" data-n="2">当 S′ = 0 时，V = (1/3)Sh，退化为棱锥的体积公式。</div>
            <div class="sol-step" data-n="3">这说明台体公式是柱体与锥体公式的“统一形式”，教材用两个棱锥体积之差给出了推导。</div>
          </div>
        </div>
      `,
    },
  });
})();

/* =============================================================
   第 3 页 · 圆柱、圆锥、圆台、球（旋转体的生成）

(function () {

  const E = window.Ink3D, G = window.Geo;

  const MODES = {

      };
      const host = ctx.root.querySelector('#p3-steps');

        { t: 'AD、BC 扫过两个圆面，分别是下、上底面，它们平行且全等。', why: '圆柱的结构特征', keys: ['r:capBottom', 'r:capTop'] },
        { t: '用垂直于轴的平面去截，截面是与底面全等的圆；用<b>过轴</b>的平面去截，截面是矩形（轴截面）。', why: '圆柱的截面性质', keys: ['r:cutP', 'r:cutA'] },
        { t: '若底面半径 r、母线长 l，则侧面积 2πrl，全面积 2πr(r+l)，体积 πr²h（这里 l = h）。', why: '8.3 圆柱的表面积与体积', keys: ['r:gen'] },
      ], ctx);
    },

    onViz(act, el, ctx) {
      if (act.indexOf('m-') === 0) {
        ctx.params.mode = act.slice(2);
        ctx.root.querySelectorAll('[data-viz^="m-"]').forEach(b => b.classList.toggle('on', b === el));
        if (ctx.showInfo) ctx.showInfo(ctx.params.mode);
        ctx.studio.dirty = true;
      }
      if (act === 'pause') {
        ctx.params.spin = ctx.params.spin ? 0 : 1;
        el.classList.toggle('on', !ctx.params.spin);
        el.textContent = ctx.params.spin ? '暂停旋转' : '继续旋转';
        ctx.studio.dirty = true;
      }
    },

    scene(t, ctx) {
      const st = ctx.studio, p = ctx.params;
      const m = p.mode;
      const cfg = MODES[m];
      const items = [];
      const th = p.spin ? p.phase + t * 1.25 : p.phase;
      const alpha = st.seeThrough ? 0.34 : 1;

      const axisTop = m === 'sphere' ? cfg.r * 1.45 : cfg.h + 0.42;
      // 旋转轴
      items.push(E.line([0, -0.42, 0], [0, axisTop, 0], { color: G.ink(st), sw: 1.1, dash: [7, 5], alpha: 0.75, key: 'r:axis' }));
      items.push(E.label([0, axisTop + 0.18, 0], '轴', { dx: 0, dy: -10, size: 12, color: G.ink(st), key: 'r:axis' }));

      if (m === 'sphere') {
        const R = cfg.r;
        items.push(G.sphere({ c: [0, R, 0], r: R, key: 'r:ball', color: G.tint(st, 0.08), alpha }));
        // 半圆（母线）在角度 th 处
        const u = [Math.cos(th), 0, Math.sin(th)];
        const pts = [];
        for (let i = 0; i <= 48; i++) {
          const a = Math.PI * i / 48;
          pts.push([R * Math.sin(a) * u[0], R - R * Math.cos(a), R * Math.sin(a) * u[2]]);
        }
        items.push(E.face(pts, { color: G.accent(st), alpha0: 0.28, edgeColor: G.accent(st), sw: 1.9, layer: 'top', key: 'r:gen', tip: '半圆绕直径旋转生成球面', hatch: true }));
        items.push(E.label(pts[24], '半圆', { dx: 18, dy: -8, size: 11.5, color: G.accent(st), key: 'r:gen' }));
        items.push(E.point([0, R, 0], { r: 3, key: 'r:O' }), E.label([0, R, 0], 'O', { dx: -12, dy: 8, key: 'r:O' }));
        items.push(G.seg([0, R, 0], [R * u[0], R, R * u[2]], { color: G.accent(st), sw: 1.5, key: 'r:rad' }));
        items.push(E.label([R * u[0] * 0.6, R, R * u[2] * 0.6], 'R', { dx: 6, dy: -10, size: 12, color: G.accent(st), key: 'r:rad' }));
        if (st.seeThrough) {
          const d = R * 0.45, rr = Math.sqrt(R * R - d * d);
          const cy = R + d;
          items.push(G.circle3([0, cy, 0], [1, 0, 0], [0, 0, 1], rr, { color: G.accent(st), sw: 1.8, alpha: 0.95, key: 'r:cutP' }));
          items.push(G.planeQuad([0, cy, 0], [1, 0, 0], [0, 0, 1], rr + 0.1, rr + 0.1, {
            color: G.accent(st), alpha: 0.13, edgeColor: G.accent(st), sw: 1, dash: [4, 4], key: 'r:cutP2',
          }));
          items.push(G.circle3([0, R, 0], [1, 0, 0], [0, 0, 1], R, { color: G.ink(st), sw: 1.3, alpha: 0.8, key: 'r:cutA' }));
          items.push(E.label([0, cy + rr + 0.05, 0], '小圆截面', { dx: 34, dy: -6, size: 11, color: G.accent(st), key: 'r:cutP' }));
        }
        return { items, fit: 0.98 };
      }

      /* 旋转体本体 */
      if (m === 'cylinder') items.push(G.cylinder({ st, r: cfg.r, h: cfg.h, y0: 0, key: 'r:body', seg: 64, alpha, rings: [[cfg.r, 0], [cfg.r, cfg.h]] }));
      if (m === 'cone') items.push(G.cone({ st, r: cfg.r, h: cfg.h, y0: 0, key: 'r:body', seg: 64, alpha, rings: [[cfg.r, 0]] }));
      if (m === 'frustum') items.push(G.roundFrustum({ st, r1: cfg.r, r2: cfg.r2, h: cfg.h, y0: 0, key: 'r:body', seg: 64, alpha, rings: [[cfg.r, 0], [cfg.r2, cfg.h]] }));

      /* 旋转的母面 */
      const u = [Math.cos(th), 0, Math.sin(th)];
      let prof;
      if (m === 'cylinder') prof = [[0, 0], [cfg.r, 0], [cfg.r, cfg.h], [0, cfg.h]];
      if (m === 'cone') prof = [[0, 0], [cfg.r, 0], [0, cfg.h]];
      if (m === 'frustum') prof = [[0, 0], [cfg.r, 0], [cfg.r2, cfg.h], [0, cfg.h]];
      const genPts = prof.map(([r, y]) => [r * u[0], y, r * u[2]]);
      items.push(E.face(genPts, {
        color: G.accent(st), alpha0: 0.3, edgeColor: G.accent(st), sw: 2.1, hatch: true,
        layer: 'top', key: 'r:gen', tip: '平面图形绕轴旋转一周，扫过整个旋转体',
      }));
      // 母线标签
      const mid = genPts[genPts.length - 2] || genPts[1];
      items.push(E.label(mid, '母线 l', { dx: 30, dy: 4, size: 11.5, color: G.accent(st), key: 'r:gen', align: 'left' }));
      // 底面半径
      items.push(G.seg([0, 0, 0], [cfg.r * u[0], 0, cfg.r * u[2]], { color: G.ink(st), sw: 1.2, key: 'r:rad' }));
      items.push(E.label([cfg.r * u[0] * 0.62, 0, cfg.r * u[2] * 0.62], 'r', { dx: 2, dy: 12, size: 12, key: 'r:rad' }));
      items.push(G.dot3([0, 0, 0], { key: 'r:O' }), E.label([0, 0, 0], 'O', { dx: -12, dy: 10, key: 'r:O' }));
      // 高
      items.push(E.line([0, 0, 0], [0, cfg.h, 0], { color: G.accent(st), sw: 1.6, key: 'r:h', dash: null }));
      items.push(E.label([0, cfg.h * 0.55, 0], 'h', { dx: -12, dy: 0, size: 12, color: G.accent(st), key: 'r:h' }));

      /* 透视：轴截面 */
      if (st.seeThrough) {
        const c = G.camXZ(st);
        const v = [Math.cos(st.yaw + Math.PI / 2), 0, Math.sin(st.yaw + Math.PI / 2)];
        let quad;
        if (m === 'cylinder') quad = [[cfg.r * v[0], 0, cfg.r * v[2]], [-cfg.r * v[0], 0, -cfg.r * v[2]], [-cfg.r * v[0], cfg.h, -cfg.r * v[2]], [cfg.r * v[0], cfg.h, cfg.r * v[2]]];
        if (m === 'cone') quad = [[cfg.r * v[0], 0, cfg.r * v[2]], [-cfg.r * v[0], 0, -cfg.r * v[2]], [0, cfg.h, 0]];
        if (m === 'frustum') quad = [[cfg.r * v[0], 0, cfg.r * v[2]], [-cfg.r * v[0], 0, -cfg.r * v[2]], [-cfg.r2 * v[0], cfg.h, -cfg.r2 * v[2]], [cfg.r2 * v[0], cfg.h, cfg.r2 * v[2]]];
        items.push(E.face(quad, { color: G.accent(st), alpha0: 0.22, edgeColor: G.accent(st), sw: 2, layer: 'top', key: 'r:cutA', tip: '轴截面：过轴的平面截旋转体所得的平面图形' }));
        // 平行底面的截面
        const yy = cfg.h * 0.55;
        let rr = cfg.r;
        if (m === 'cone') rr = cfg.r * (1 - 0.55);
        if (m === 'frustum') rr = cfg.r + (cfg.r2 - cfg.r) * 0.55;
        items.push(G.circle3([0, yy, 0], [1, 0, 0], [0, 0, 1], rr, { color: G.accent(st), sw: 1.8, key: 'r:cutP' }));
        items.push(G.planeQuad([0, yy, 0], [1, 0, 0], [0, 0, 1], rr + 0.08, rr + 0.08, {
          color: G.accent(st), alpha: 0.12, edgeColor: G.accent(st), sw: 1, dash: [4, 4], key: 'r:cutP2',
        }));
        items.push(E.label([0, yy + 0.02, rr + 0.06], '平行底面的截面是圆', { dx: 40, dy: -4, size: 10.5, color: G.accent(st), key: 'r:cutP' }));
      }
      return { items, fit: 0.98 };
    },

    tip: `旋转体的三个关键词：<b>轴</b>（旋转所绕的直线）、<b>母线</b>（旋转成侧面的那条线）、<b>底面</b>（垂直于轴的边旋转成的圆面）。圆柱母线 ∥ 轴，圆锥母线交于顶点，圆台母线延长后交于一点。`,

    scene(t, ctx) {

      items.push(E.label([2.02 * c, 0, -2.02 * s], 'y′', { dx: 10, dy: -4, size: 12, key: 'ax:y' }));
      items.push(G.dot3([0, 0, 0], { key: 'ax:O' }));
      items.push(E.label([0, 0, 0], 'O′', { dx: -17, dy: 17, size: 12, key: 'ax:O' }));

      items.push(E.label([0, 1.72, 0], 'z′', { size: 11.5, key: 'ax:z' }));

      if (p.mode === 'cuboid') {
        /* 长方体直观图：长 3、宽 2、高 1.5，y 方向取一半并成 th 角 */
        const L = 3, W = 2, H = 1.5;
        const m = 0.66;      // 横向缩放，适配画面
        const X = x => x * m, Hh = y => y * m;
        const P = (x, y, z) => [X(x) + (W / 2) * 0 + (y / 2) * c * m, Hh(z), -(y / 2) * s * m];
        const B = [P(-1.5, 0, 0), P(1.5, 0, 0), P(1.5, W, 0), P(-1.5, W, 0)];
        const T = B.map(q => [q[0], q[1] + Hh(H), q[2]]);
        const ox = -0.55;
        const shift1 = arr => arr.map(q => [q[0] + ox, q[1], q[2]]);
        const Bs = shift1(B), Ts = shift1(T);
        const skin = G.tint(st, 0.03);

        items.push(E.face([Bs[3], Bs[2], Bs[1], Bs[0]], { color: skin, key: 'cb:base', edgeColor: G.ink(st), sw: 1.5 }));

            <div class="sol-step" data-n="3">该边在底边方向上的高为 1 × sin45° = √2/2，故面积 S = 2 × √2/2 = √2。</div>
            <div class="sol-step" data-n="4">一般结论：<span class="hl2">S<sub>直观图</sub> = (√2/4)·S<sub>原图</sub></span>。这里 4 × √2/4 = √2，一致。</div>

            <div class="sol-step" data-n="1">直观图面积 S′ = √3/4 × 1² = √3/4。</div>
            <div class="sol-step" data-n="2">由 S′ = (√2/4)S 得 S = (4/√2)S′ = 2√2 × √3/4 = √6/2。</div>

        </div>
        <div class="q">
          <div class="q-head"><span class="qn">3</span><span>判断：直观图中，原图中长度为 4 且平行于 y 轴的线段，在直观图中的长度为 4。</span></div>

            <button class="opt" data-ok="0"><span class="mk">A</span>正确</button>

          <div class="q-head"><span class="qn">4</span><span>（教材习题 8.2 第 1 题变式）用斜二测画法画水平放置的正三角形的直观图，若原正三角形边长为 a，求直观图中最长边的长度。</span></div>
          <button class="ans-btn" data-reveal>显示答案与步骤</button>

            <div class="sol-step" data-n="1">取底边所在直线为 x 轴，底边在直观图中长度不变，仍为 a。</div>
            <div class="sol-step" data-n="2">另外两边原长 a，方向倾斜，画成直观图后长度变为 √((a/2)² + (√3a/4)²)= √(a²/4 + 3a²/16) = √(7a²/16) = (√7/4)a ≈ 0.66a。</div>

  function enginePalette(p) {

      tint: p.tint,

  function applyCssPalette(p) {
    document.documentElement.style.setProperty('--accent', p.accent);
    document.documentElement.style.setProperty('--accent-soft', p.soft);
    document.documentElement.style.setProperty('--tint', p.tint);

  /* =============================================================
     分步例题：点击“下一步”逐步高亮，并同步 3D 图元
     ============================================================= */
  function mountSteps(host, steps, ctx, opts) {
    opts = opts || {};
    let idx = -1;
    host.innerHTML = steps.map((s, i) => `
      <div class="step" data-i="${i}">
        <div class="sn">${i + 1}</div>
        <div class="sc">${s.t}${s.why ? `<span class="why">${s.why}</span>` : ''}</div>
      </div>`).join('') + `
      <div class="step-ctl">
        <button class="btn tiny" data-s="prev">上一步</button>
        <button class="btn tiny primary" data-s="next">下一步 ▸</button>
        <button class="btn tiny" data-s="all">全部展开</button>
        <button class="btn tiny" data-s="reset">重播</button>
      </div>`;
    const nodes = [...host.querySelectorAll('.step')];
    const btns = {
      prev: host.querySelector('[data-s="prev"]'),
      next: host.querySelector('[data-s="next"]'),
      all: host.querySelector('[data-s="all"]'),
      reset: host.querySelector('[data-s="reset"]'),
    };

    function paint() {
      nodes.forEach((n, i) => {
        n.classList.toggle('show', i <= idx);
        n.classList.toggle('now', i === idx);
      });
      btns.prev.disabled = idx <= 0;
      btns.next.disabled = idx >= steps.length - 1;
      const cur = idx >= 0 ? steps[idx] : null;
      if (ctx.studio) {
        if (cur && cur.keys) ctx.studio.focusOn(cur.keys);
        else if (cur && cur.keys === null) ctx.studio.clearFocus();
      }
      if (opts.onStep) opts.onStep(idx, cur);
      if (cur && !opts.noScroll) {
        const n = nodes[idx];
        if (n && n.scrollIntoView) n.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
    }
    function next() { if (idx < steps.length - 1) { idx++; paint(); } }
    function prev() { if (idx > 0) { idx--; paint(); } }
    host.addEventListener('click', e => {
      const b = e.target.closest('[data-s]');
      if (!b) return;
      const a = b.getAttribute('data-s');
      if (a === 'next') next();
      else if (a === 'prev') prev();
      else if (a === 'all') { idx = steps.length - 1; paint(); }
      else if (a === 'reset') { idx = 0; paint(); }
    });
    idx = 0;
    paint();
    return { next, prev, goto: i => { idx = i; paint(); }, get index() { return idx; } };
  }

  /* =============================================================
     渲染整本书
     ============================================================= */
  function pageTotal() { return window.PAGES.length; }

  function renderBook(animateDir) {
    const p = window.PAGES[state.page];
    app.current = p;
    if (app.studio) { app.studio.destroy(); app.studio = null; }
    const book = app.el.book;
    book.innerHTML = '';
    book.classList.toggle('cover-mode', p.kind === 'cover');

    if (p.kind === 'cover') {
      book.innerHTML = coverHTML(p);
      afterMount(p, book);
      bindCover(book);
      return;
    }

    book.innerHTML = spreadHTML(p, state.page);

    // 翻页动画层
    const layer = document.createElement('div');
    layer.className = 'flip-layer';
    layer.innerHTML = '<div class="flip-page"></div>';
    book.appendChild(layer);
    if (animateDir) {
      layer.classList.add('run', animateDir === 'next' ? 'next' : 'prev');
      setTimeout(() => layer.classList.remove('run', 'next', 'prev'), 660);
    }

    afterMount(p, book);
  }

          </div>

  function spreadHTML(p, idx) {

  function afterMount(p, root) {
    // 标签页
    root.querySelectorAll('.tab').forEach(t => {
      t.addEventListener('click', () => {
        root.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
        const k = t.getAttribute('data-tab');
        root.querySelectorAll('.pane-block').forEach(b => b.classList.toggle('on', b.getAttribute('data-pane') === k));
        if (p.onTab) p.onTab(k, app.studio);
      });
    });
    // 提示条
    const tipBtn = root.querySelector('[data-tip]');
    if (tipBtn) tipBtn.addEventListener('click', () => {
      const m = root.querySelector('.tip-more');
      if (m) m.classList.toggle('open');
    });
    // 翻页
    root.querySelectorAll('[data-turn]').forEach(b => {
      b.addEventListener('click', e => {
        e.stopPropagation();
        go(state.page + (b.getAttribute('data-turn') === 'next' ? 1 : -1));
      });
    });
    // 画布
    const canvas = root.querySelector('.viz canvas');
    if (!canvas) return;
    const pidx = state.page;
    const studio = new E.Studio(canvas, Object.assign({ yaw: -0.6, pitch: 0.34, zoom: 1 }, p.camera || {}));
    app.studio = studio;
    studio.setPalette(enginePalette(PALETTES[state.palette]));
    studio.seeThrough = state.seeThrough;
    studio.showLabels = state.labels;
    studio.onPick = (key, tip) => { if (p.onPick) p.onPick(key, tip, ctxObj(studio, root, p)); };
    studio.autoSpin = p.autoSpin || 0;
    const ctx = ctxObj(studio, root, p);
    if (p.scene) studio.setScene((t) => p.scene(t, ctx));
    // 工具条
    root.querySelectorAll('[data-viz]').forEach(b => {
      b.addEventListener('click', () => {
        const act = b.getAttribute('data-viz');
        if (act === 'zoom-in') studio.zoom = Math.min(3.2, studio.zoom * 1.12);
        else if (act === 'zoom-out') studio.zoom = Math.max(0.45, studio.zoom / 1.12);
        else if (act === 'reset') { studio.reset(); if (p.resetView) p.resetView(ctx); }
        else if (p.onViz) p.onViz(act, b, ctx);
        studio.dirty = true;
      });
    });
    // 参数滑块（高度、拆解程度等）
    root.querySelectorAll('[data-param]').forEach(inp => {
      const k = inp.getAttribute('data-param');
      if (ctx.params[k] == null) ctx.params[k] = parseFloat(inp.value);
      inp.value = ctx.params[k];
      const out = inp.parentElement.querySelector('.v');
      const sync = () => {
        const v = parseFloat(inp.value);
        ctx.params[k] = v;
        if (out) out.textContent = inp.getAttribute('data-unit') ? v.toFixed(2) + inp.getAttribute('data-unit') : v.toFixed(2);
        if (out) out.textContent = v.toFixed(2);
        studio.dirty = true;
        if (p.onParam) p.onParam(k, v, ctx);
      };
      inp.addEventListener('input', sync);
      sync();
    });
    if (p.init) p.init(ctx);
    studio.dirty = true;
  }

  function ctxObj(studio, root, p) {
    const ctx = {
      studio, root, page: p, params: Object.assign({}, p.defaults || {}),
      set(k, v) { ctx.params[k] = v; studio.dirty = true; },
      get(k) { return ctx.params[k]; },
      refresh() { studio.dirty = true; },
      activeTab() { const t = root.querySelector('.tab.on'); return t ? t.getAttribute('data-tab') : 'knowledge'; },
      goto: go,
    };
    return ctx;
  }

    studio.seeThrough = state.seeThrough;
    studio.showLabels = state.labels;

    const ctx = ctxObj(studio, root, p);
    studio.setScene((t) => p.scene(t, ctx));
    // 参数滑块（高度、拆解程度等）
    root.querySelectorAll('[data-param]').forEach(inp => {
      const k = inp.getAttribute('data-param');
      if (ctx.params[k] == null) ctx.params[k] = parseFloat(inp.value);
      inp.value = ctx.params[k];
      const out = inp.parentElement.querySelector('.v');
      const sync = () => {
        const v = parseFloat(inp.value);
        ctx.params[k] = v;
        if (out) out.textContent = inp.getAttribute('data-unit') ? v.toFixed(2) + inp.getAttribute('data-unit') : v.toFixed(2);
        if (out) out.textContent = v.toFixed(2);
        studio.dirty = true;
        if (p.onParam) p.onParam(k, v, ctx);
      };
      inp.addEventListener('input', sync);
      sync();
    });
    if (p.init) p.init(ctx);
    root.querySelectorAll('[data-goto]').forEach(a => {
      a.addEventListener('click', e => { e.preventDefault(); go(parseInt(a.getAttribute('data-goto'), 10)); });
    });
  }

  /* =============================================================
     导航
     ============================================================= */
  function go(n, animate) {
    const total = pageTotal();
    if (n < 0 || n >= total) return;
    const dir = animate === false ? null : (n > state.page ? 'next' : 'prev');
    state.page = n;
    renderBook(dir);
    updateNav();
    try { history.replaceState(null, '', '#' + n); } catch (e) {}
  }
  window.BOOK_GO = go;

  function updateNav() {
    const total = pageTotal();
    const p = window.PAGES[state.page];
    app.el.prev.disabled = state.page <= 0;
    app.el.next.disabled = state.page >= total - 1;
    app.el.fill.style.width = ((state.page + 1) / total * 100).toFixed(1) + '%';
    app.el.label.textContent = p.kind === 'cover' ? '封面' : `${state.page} / ${total - 1} · ${p.chapter || ''}`;
    app.el.dots.innerHTML = window.PAGES.map((x, i) =>
      `<button data-dot="${i}" class="${i === state.page ? 'on' : ''}" title="${x.short || x.title}"></button>`).join('');
  }

  /* =============================================================
     全局控件
     ============================================================= */
  function bindGlobal() {
    app.el.see.addEventListener('click', () => {
      state.seeThrough = !state.seeThrough;
      app.el.see.classList.toggle('on', state.seeThrough);
      if (app.studio) { app.studio.seeThrough = state.seeThrough; app.studio.dirty = true; }
    });
    app.el.labels.addEventListener('click', () => {
      state.labels = !state.labels;
      app.el.labels.classList.toggle('on', state.labels);
      if (app.studio) { app.studio.showLabels = state.labels; app.studio.dirty = true; }
    });
    app.el.swatches.innerHTML = PALETTES.map((p, i) =>
      `<button class="swatch ${i === 0 ? 'on' : ''}" data-pal="${i}" title="${p.name}" style="background:${p.accent}"></button>`).join('');
    app.el.swatches.addEventListener('click', e => {
      const b = e.target.closest('[data-pal]');
      if (!b) return;
      state.palette = parseInt(b.getAttribute('data-pal'), 10);
      app.el.swatches.querySelectorAll('.swatch').forEach((s, i) => s.classList.toggle('on', i === state.palette));
      applyCssPalette(PALETTES[state.palette]);
      if (app.studio) app.studio.setPalette(enginePalette(PALETTES[state.palette]));
    });
    app.el.reset.addEventListener('click', () => {
      if (app.studio) app.studio.reset();
      if (app.current && app.current.resetParams) app.current.resetParams(app.studio);
    });
    app.el.prev.addEventListener('click', () => go(state.page - 1));
    app.el.next.addEventListener('click', () => go(state.page + 1));
    document.querySelector('.dots').addEventListener('click', e => {
      const b = e.target.closest('[data-dot]');
      if (b) go(parseInt(b.getAttribute('data-dot'), 10));
    });
    document.addEventListener('keydown', e => {
      const t = e.target;
      if (t && t.matches && t.matches('input, textarea')) return;
      if (e.key === 'ArrowRight' || e.key === 'PageDown') { go(state.page + 1); e.preventDefault(); }
      if (e.key === 'ArrowLeft' || e.key === 'PageUp') { go(state.page - 1); e.preventDefault(); }
      if (e.key === 't' || e.key === 'T') app.el.see.click();
      if (e.key === 'l' || e.key === 'L') app.el.labels.click();
    });
  }

  /* =============================================================
     习题交互（答案展开、选项判定、表格揭示、跳页）
     ============================================================= */
  function bindPractice() {
    document.addEventListener('click', e => {
      const rev = e.target.closest('[data-reveal]');
      if (rev) {
        const sel = rev.getAttribute('data-reveal');
        let box = sel ? document.getElementById(sel) : null;
        if (!box) {
          let n = rev.nextElementSibling;
          while (n && !n.classList.contains('ans')) n = n.nextElementSibling;
          box = n;
        }
        if (box) {
          const open = !box.classList.contains('open');
          box.classList.toggle('open', open);
          rev.textContent = open ? (rev.getAttribute('data-close') || '收起答案') : (rev.getAttribute('data-open') || '显示答案与步骤');
          if (open) {
            [...box.querySelectorAll('.sol-step')].forEach((s, i) => {
              s.style.animationDelay = (i * 80) + 'ms';
            });
            const st = box.getAttribute('data-focus');
            if (st && app.studio) app.studio.focusOn(st.split(','));
          } else if (app.studio) app.studio.clearFocus();
        }
        return;
      }
      const opt = e.target.closest('.opt');
      if (opt) {
        const group = opt.parentElement;
        const ok = opt.getAttribute('data-ok') === '1';
        opt.classList.add(ok ? 'right' : 'wrong');
        if (ok) {
          group.querySelectorAll('.opt').forEach(o => { if (o !== opt) o.classList.add('dim'); });
        } else {
          const right = group.querySelector('.opt[data-ok="1"]');
          if (right) right.classList.add('right');
        }
        return;
      }
      const tr = e.target.closest('[data-table-reveal]');
      if (tr) {
        const tb = tr.closest('.card, .q, section') || document;
        const table = tb.querySelector('table.tb') || tr.parentElement.querySelector('table.tb');
        if (table) {
          const open = !table.classList.contains('reveal');
          table.classList.toggle('reveal', open);
          tr.textContent = open ? '隐藏答案' : '核对答案';
        }
        return;
      }
      const j = e.target.closest('[data-goto]');
      if (j) { e.preventDefault(); go(parseInt(j.getAttribute('data-goto'), 10)); }
    });
  }

  /* =============================================================
     启动
     ============================================================= */
  function boot() {
    app.state = state;
    app.el.book = document.getElementById('book');
    app.el.prev = document.getElementById('nav-prev');
    app.el.next = document.getElementById('nav-next');
    app.el.fill = document.getElementById('prog-fill');
    app.el.label = document.getElementById('page-label');
    app.el.dots = document.querySelector('.dots');
    app.el.see = document.getElementById('btn-see');
    app.el.labels = document.getElementById('btn-labels');
    app.el.swatches = document.getElementById('swatches');
    app.el.reset = document.getElementById('btn-reset');

    applyCssPalette(PALETTES[0]);
    bindGlobal();
    bindPractice();

    let start = 0;
    const h = parseInt((location.hash || '').replace('#', ''), 10);
    if (!isNaN(h) && h >= 0 && h < window.PAGES.length) start = h;
    state.page = start;
    renderBook(null);
    updateNav();
  }

  window.UI = { mountSteps, go, state, PALETTES };
  document.addEventListener('DOMContentLoaded', boot);
})();

</script>
</body>
</html>
